# =============================================
# Log4j 日志配置 - MyBatis 开发专用
# 目标：完整输出 SQL 语句、参数绑定、结果集行数
# 价值：追踪SQL执行 | 核对参数绑定 | 验证结果映射 | 定位异常 | 排查性能瓶颈
# =============================================

# ---------- 1. 根日志：全局默认级别 INFO，输出到控制台和文件 ----------
log4j.rootLogger=INFO, stdout, file

# ---------- 2. 控制台 Appender ----------
# 实时查看，开发调试用
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
# 格式：时间 [线程] 级别 Logger简称 - 消息
log4j.appender.stdout.layout.ConversionPattern=%d [%t] %-5p %-40c - %m%n

# ---------- 3. 文件 Appender ----------
# 保存完整日志到文件，便于事后排查
log4j.appender.file=org.apache.log4j.FileAppender
log4j.appender.file.File=logs/mybatis.log
log4j.appender.file.Append=true
log4j.appender.file.layout=org.apache.log4j.PatternLayout
# 格式：时间 | 线程 | 级别 | 完整Logger名 | 消息
log4j.appender.file.layout.ConversionPattern=%d | %t | %-5p | %c | %m%n

# =============================================
# 4. MyBatis 精细化日志配置 ⭐ 核心
# =============================================

# 4.1 MyBatis 框架本身 - 只报警告，不吵
log4j.logger.org.apache.ibatis=WARN

# 4.2 SqlSession 生命周期 - DEBUG 显示会话打开/关闭
log4j.logger.org.apache.ibatis.session=DEBUG

# 4.3 ⭐ JDBC Layer Logger - TRACE 输出 SQL + 参数 + 结果
#     这三行是完整日志输出的关键：
#     ConnectionLogger    → 数据库连接、commit、rollback
#     PreparedStatementLogger → 完整 SQL 语句 + ? 占位符的实参绑定
#     ResultSetLogger     → 结果集行数
log4j.logger.org.apache.ibatis.logging.jdbc=TRACE

# 4.4 Mapper 接口层 - DEBUG 显示每个 Mapper 方法的调用入口
log4j.logger.com.mapper=DEBUG

# =============================================
# 5. JDBC 驱动层（可选，显示底层 JDBC 操作细节）
# =============================================
log4j.logger.java.sql.Connection=DEBUG
log4j.logger.java.sql.Statement=DEBUG
log4j.logger.java.sql.PreparedStatement=DEBUG
log4j.logger.java.sql.ResultSet=WARN

# =============================================
# 6. 数据源连接池（POOLED）
# =============================================
log4j.logger.org.apache.ibatis.datasource=WARN

# =============================================
# 7. 性能提示（超过 1 秒的 SQL 警告）
# =============================================
log4j.logger.org.apache.ibatis.executor=DEBUG